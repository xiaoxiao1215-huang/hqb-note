site_name: 我的作业&技术笔记
site_url: https://你的用户名.github.io/my-notes/ # 后面改
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: blue
plugins:
  - search: # 自带搜索
markdown_extensions:
  - attr_list
  - md_in_html # 【关键】支持markdown里面直接写HTML
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - 首页: index.md
  - Python笔记:
      - Python基础: python/python基础.md
  - MySQL笔记:
      - MySQL查询: mysql/mysql查询.md
  - Docker笔记:
      - Docker安装: docker/docker安装.md

